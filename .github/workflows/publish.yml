name: Publish Chinese portable edition

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: composa-zh-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == '0505YZX/Composa-zh-CN' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out publication inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Use the owner's anonymous email in existing commits
        env:
          COMPOSA_ANON_EMAIL: 223406399+0505YZX@users.noreply.github.com
        run: |
          python3 - <<'PY'
          import os, subprocess
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs)
          before = git('rev-parse', 'HEAD').decode().strip()
          assert before == os.environ['GITHUB_SHA'], 'Unexpected checkout revision'
          revisions = git('rev-list', '--reverse', '--topo-order', 'HEAD').decode().splitlines()
          rewritten = {}
          for old in revisions:
              headers, _, message = git('cat-file', 'commit', old).partition(b'\n\n')
              tree = next(x.split()[1].decode() for x in headers.splitlines() if x.startswith(b'tree '))
              parents = [x.split()[1].decode() for x in headers.splitlines() if x.startswith(b'parent ')]
              env = os.environ.copy()
              env['GIT_AUTHOR_NAME'] = git('show', '-s', '--format=%an', old).decode().strip()
              env['GIT_COMMITTER_NAME'] = git('show', '-s', '--format=%cn', old).decode().strip()
              env['GIT_AUTHOR_EMAIL'] = env['GIT_COMMITTER_EMAIL'] = env['COMPOSA_ANON_EMAIL']
              env['GIT_AUTHOR_DATE'] = git('show', '-s', '--format=%ad', '--date=raw', old).decode().strip()
              env['GIT_COMMITTER_DATE'] = git('show', '-s', '--format=%cd', '--date=raw', old).decode().strip()
              args = ['commit-tree', tree]
              for parent in parents:
                  args += ['-p', rewritten[parent]]
              rewritten[old] = git(*args, input=message, env=env).decode().strip()
          after = rewritten[before]
          subprocess.run(['git', 'diff', '--exit-code', before, after], check=True)
          subprocess.run(['git', 'push', f'--force-with-lease=refs/heads/main:{before}', 'origin', f'{after}:refs/heads/main'], check=True)
          print(f'Anonymized {len(revisions)} commits; all repository files retained.')
          PY

      - name: Download the pinned upstream source
        run: |
          git -c core.autocrlf=false clone --depth 1 --branch v1.4.0 https://github.com/dvdstelt/Composa.git "$RUNNER_TEMP/composa-upstream"
          test "$(git -C "$RUNNER_TEMP/composa-upstream" rev-parse HEAD)" = "86529d3b5355d28ddc28ec3db2e4de1d4d00f63b"

      - name: Assemble and verify the two download archives
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, urllib.request, zipfile
          root = pathlib.Path.cwd()
          parts = sorted((root / 'release-data').glob('payload-*.b64'))
          assert len(parts) == 4, 'Missing publication input'
          data = base64.b64decode(''.join(p.read_text(encoding='ascii') for p in parts))
          assert hashlib.sha256(data).hexdigest() == 'a1a4d95d830c1f63b5d17d62e2333a13f70592e8a4749e6a34c1f365c4a887d2', 'Publication input checksum mismatch'
          payload = zipfile.ZipFile(io.BytesIO(data))
          assert payload.testzip() is None
          manifest = json.loads(payload.read('manifest.json'))
          for name in payload.namelist():
              assert not name.startswith('/') and '..' not in pathlib.PurePosixPath(name).parts
          asset = 'https://github.com/dvdstelt/Composa/releases/download/v1.4.0/composa-1.4.0-win-x64.zip'
          request = urllib.request.Request(asset, headers={'User-Agent': 'Composa-zh-publication'})
          with urllib.request.urlopen(request, timeout=90) as response:
              original_bytes = response.read()
          assert hashlib.sha256(original_bytes).hexdigest() == manifest['upstreamZipSha256'], 'Upstream package checksum mismatch'
          original = zipfile.ZipFile(io.BytesIO(original_bytes))
          assert original.testzip() is None
          upstream = pathlib.Path(os.environ['RUNNER_TEMP']) / 'composa-upstream'
          crlf = set(manifest['crlf'])
          entries = set(payload.namelist())
          portable_values = {}
          source_values = {}
          for name, expected in manifest['portable'].items():
              assert '..' not in pathlib.PurePosixPath(name).parts and not name.startswith('/')
              overlay = 'portable/' + name
              if overlay in entries:
                  value = payload.read(overlay)
              else:
                  assert name.startswith('软件/')
                  value = original.read('composa-1.4.0-win-x64/' + name[len('软件/'):])
              assert hashlib.sha256(value).hexdigest() == expected, 'Portable content mismatch: ' + name
              portable_values['Composa-1.4.0-zh-CN-win-x64/' + name] = value
          for name, expected in manifest['source'].items():
              assert '..' not in pathlib.PurePosixPath(name).parts and not name.startswith('/')
              overlay = 'source/' + name
              if overlay in entries:
                  value = payload.read(overlay)
              else:
                  assert name.startswith('源码/source/')
                  relative = name[len('源码/source/'):]
                  value = (upstream / relative).read_bytes()
                  if relative in crlf:
                      value = value.replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')
              assert hashlib.sha256(value).hexdigest() == expected, 'Source content mismatch: ' + name
              source_values[name] = value
          assert len(portable_values) == 250 and len(source_values) == 297
          assert 'Composa-1.4.0-zh-CN-win-x64/软件/portable.marker' in portable_values
          assert not any('/data/' in n or n.endswith('.lnk') for n in portable_values)
          assert hashlib.sha256(portable_values['Composa-1.4.0-zh-CN-win-x64/软件/composa.dll']).hexdigest() == '431a0f0fac7aa429894ad44c8c1c78c7b4746e71fe3a6952586da23d09ab0547'
          translations = json.loads(source_values['源码/source/src/Composa.App/zh-CN.json'].decode('utf-8-sig'))
          assert len(translations) == 763
          dist = root / 'dist'
          dist.mkdir(exist_ok=True)
          for filename, values in [('Composa-1.4.0-zh-CN-win-x64.zip', portable_values), ('Composa-1.4.0-zh-CN-source.zip', source_values)]:
              path = dist / filename
              with zipfile.ZipFile(path, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
                  for name, value in values.items():
                      info = zipfile.ZipInfo(name, date_time=(2026, 10, 7, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      archive.writestr(info, value, compresslevel=6)
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None
                  assert len(archive.namelist()) == len(values)
              print(filename, path.stat().st_size, 'bytes; every file matches the verified local edition.')
          sums = ''.join(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n' for path in sorted(dist.glob('*.zip')))
          (dist / 'SHA256SUMS.txt').write_text(sums, encoding='ascii')
          (dist / 'release-notes.txt').write_bytes(payload.read('release-notes.txt'))
          PY

      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request
          repo = '0505YZX/Composa-zh-CN'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          tag = 'v1.4.0-zh.1'
          title = 'Composa 1.4.0 简体中文 Windows 便携版（社区汉化）'
          base = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'Composa-zh-publication', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(method, url, value=None):
              request_headers = dict(headers)
              data = None
              if value is not None:
                  data = json.dumps(value).encode('utf-8')
                  request_headers['Content-Type'] = 'application/json'
              with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=request_headers, method=method), timeout=120) as response:
                  return json.load(response)
          dist = pathlib.Path('dist')
          notes = (dist / 'release-notes.txt').read_text(encoding='utf-8-sig')
          releases = api('GET', base + '/releases?per_page=100')
          candidates = [r for r in releases if r['tag_name'] == tag or (r['draft'] and r['name'] == title)]
          assert len(candidates) <= 1, 'Ambiguous existing release drafts'
          body = {'tag_name': tag, 'target_commitish': 'main', 'name': title, 'body': notes, 'draft': True, 'prerelease': False}
          if candidates:
              release = candidates[0]
              assert release['draft'], 'This version has already been published; no files overwritten'
              release = api('PATCH', base + '/releases/' + str(release['id']), body)
          else:
              release = api('POST', base + '/releases', body)
          existing = {a['name']: a for a in release['assets']}
          paths = [dist / 'Composa-1.4.0-zh-CN-win-x64.zip', dist / 'Composa-1.4.0-zh-CN-source.zip', dist / 'SHA256SUMS.txt']
          for path in paths:
              digest = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
              if path.name in existing:
                  assert existing[path.name]['digest'] == digest, 'Existing attachment differs: ' + path.name
                  continue
              url = 'https://uploads.github.com/repos/' + repo + '/releases/' + str(release['id']) + '/assets?name=' + urllib.parse.quote(path.name)
              upload_headers = dict(headers)
              upload_headers['Content-Type'] = 'application/zip' if path.suffix == '.zip' else 'text/plain'
              request = urllib.request.Request(url, data=path.read_bytes(), headers=upload_headers, method='POST')
              with urllib.request.urlopen(request, timeout=180) as response:
                  uploaded = json.load(response)
              assert uploaded['digest'] == digest and uploaded['size'] == path.stat().st_size
              print('Uploaded and verified:', path.name)
          check = api('GET', base + '/releases/' + str(release['id']))
          assets = {a['name']: a for a in check['assets']}
          for path in paths:
              assert assets[path.name]['digest'] == 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
          published = api('PATCH', base + '/releases/' + str(release['id']), {'draft': False, 'make_latest': 'true'})
          assert not published['draft']
          print('Published:', published['html_url'])
          PY
